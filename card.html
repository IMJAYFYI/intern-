<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Card Design</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Main Card */
.card{
    width:1000px;
    height:550px;
    background:#fff;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    display:flex;
    overflow:hidden;
    position:relative;
}

/* Left Section */
.left{
    width:50%;
    padding:40px;
}

.left h3{
    color:#777;
    letter-spacing:2px;
    margin-bottom:8px;
}

.left h1{
    font-size:38px;
    font-weight:900;
    margin-bottom:25px;
}

.left ul{
    list-style:disc;
    padding-left:22px;
    color:#444;
    line-height:1.9;
    font-size:18px;
}

.left ul li{
    margin-bottom:5px;
}

.blue-text{
    color:#0066ff;
    font-weight:900;
}

.bold-large{
    font-weight:900;
    font-size:22px;
}

.bold{
    font-weight:900;
}

/* Toggle Button */
.toggle{
    display:inline-block;
    width:50px;
    height:24px;
    background:#0066ff;
    border-radius:20px;
    vertical-align:middle;
    position:relative;
    margin-left:8px;
}

.toggle::after{
    content:"";
    width:18px;
    height:18px;
    background:#fff;
    border-radius:50%;
    position:absolute;
    top:3px;
    right:3px;
}

/* Middle Divider */
.divider{
    width:2px;
    background:#dcdcdc;
    position:relative;
}

.new-badge{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%) rotate(-12deg);
    width:55px;
    height:55px;
    background:#26c943;
    color:#fff;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:16px;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
    z-index:999;
}




/* Right Section */
.right{
    width:50%;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to bottom right, #c2185b, #4a148c);
}

/* Card Images */
.stack{
    position:relative;
    width:320px;
    height:220px;
}

.biz-card{
    width:250px;
    height:140px;
    background:#fff;
    border-radius:8px;
    position:absolute;
    box-shadow:0 18px 25px rgba(0,0,0,0.2);
    border:1px solid #ddd;
}

/* Back cards */
.card1{
    top:35px;
    left:20px;
    transform:rotate(-12deg);
}

.card2{
    top:20px;
    left:55px;
    transform:rotate(10deg);
}

/* Front card */
.card3{
    top:55px;
    left:65px;
    z-index:5;
}

.black-strip{
    width:100%;
    height:45px;
    background:#111;
    border-radius:8px 8px 0 0;
}

.lines{
    padding:15px;
}

.line{
    height:10px;
    background:#ccc;
    margin-bottom:8px;
    border-radius:4px;
}

.line.short{
    width:60%;
}
</style>
</head>
<body>

<div class="card">

    Left Section -->
    <div class="left">
        <h3>PRINT</h3>
        <h1>Business Cards</h1>

        <ul>
            <li>8.5 x 11,10 up template</li>
            <li>Full bleed color option</li>
            <li>Tic marks for easy cuts</li>
            <li>Safe zones for content</li>
            <li><span class="blue-text">★ Card</span> option included</li>
            <li>
                <span class="bold-large">All - New</span> properties
                <span class="toggle"></span>
            </li>
            <li><span class="bold">New</span> starter sample card</li>
        </ul>
    </div>

    <!-- Divider -->
    <div class="divider">
        <div class="new-badge">NEW</div>
    </div>

    <!-- Right Section -->
    <div class="right">
        <div class="stack">

            <div class="biz-card card1">
                <div class="black-strip"></div>
                <div class="lines">
                    <div class="line"></div>
                    <div class="line short"></div>
                </div>
            </div>

            <div class="biz-card card2">
                <div class="black-strip"></div>
                <div class="lines">
                    <div class="line"></div>
                    <div class="line short"></div>
                </div>
            </div>

            <div class="biz-card card3">
                <div class="black-strip"></div>
                <div class="lines">
                    <div class="line"></div>
                    <div class="line short"></div>
                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
